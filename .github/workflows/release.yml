# Builds one archive per OS and publishes both as a GitHub release. Each archive unpacks
# to splatnet3/ and holds only what that OS needs; a new file ships in both unless it is
# excluded below. Three ways in, all ending with the archives attached:
#   - push a v* tag
#   - Actions > release > Run workflow, with a tag: an existing tag is released as is,
#     a new one is created on the given commit, or else on the branch picked there.
#     GitHub refuses the tag when that commit's .github/workflows differ from the
#     branch's: push such a tag from a git client instead
#   - create the release in GitHub's web UI: its new tag triggers this, which then
#     attaches the archives to that release and keeps the notes written there
# The notes list the commits since the previous tag. Run the workflow again on an
# existing release to rebuild its archives and notes.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.1.0 (created if it does not exist)'
        required: true
      commit:
        description: 'Commit to create a new tag on (default: the head of the selected branch; its workflows must match the branch)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the tags, to release an existing one

      - name: Pick the tree to release
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "REF=refs/tags/$TAG" >> "$GITHUB_ENV"
            echo "NEW_TAG=" >> "$GITHUB_ENV"
          else
            ref="$(git rev-parse --verify "${COMMIT:-HEAD}^{commit}")"
            echo "REF=$ref" >> "$GITHUB_ENV"
            echo "NEW_TAG=1" >> "$GITHUB_ENV"
          fi

      - name: Build the archives
        # .gitattributes is read from the released tree even though it is not shipped,
        # so the .cmd/.ps1 files in the zip keep their CRLF line endings
        run: |
          git archive --format=tar.gz --prefix=splatnet3/ -o splatnet3-stats-setup-linux.tar.gz "$REF" -- . \
            ':!.github' ':!.gitattributes' ':!.gitignore' ':!tests' \
            ':!install.ps1' ':!bin/*.cmd' ':!bin/supervise.pyw' ':!config/windows'
          git archive --format=zip --prefix=splatnet3/ -o splatnet3-stats-setup-windows.zip "$REF" -- . \
            ':!.github' ':!.gitattributes' ':!.gitignore' ':!tests' \
            ':!install.sh' ':!systemd' ':!config/linux' \
            ':!bin/stu' ':!bin/stu-headless' ':!bin/stu-s3s' ':!bin/stu-s3s-upstream' ':!bin/stu-sdk'

      - name: Write the notes
        # the commits since the previous tag, without the "(#N)" GitHub appends to
        # squash merges
        run: |
          prev="$(git describe --tags --abbrev=0 "$REF^" 2>/dev/null || true)"
          {
            echo '## Changes'
            echo
            git log --no-merges --format='- %s' "${prev:+$prev..}$REF" | sed -E 's/ \(#[0-9]+\)$//'
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(splatnet3-stats-setup-linux.tar.gz splatnet3-stats-setup-windows.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            # a release created in the web UI keeps its own notes
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            fi
          elif [ -n "$NEW_TAG" ]; then
            gh release create "$TAG" --target "$REF" --title "$TAG" --notes-file notes.md "${assets[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${assets[@]}"
          fi
